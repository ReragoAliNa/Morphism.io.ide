[package]
name = "morphism-io-ide"
version = "0.1.0"
description = "Morphism.io IDE Desktop"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
